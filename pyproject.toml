[project]
name = "paper-research-agent"
version = "0.2.0"
description = "MCP-based multi-source paper retrieval and synthesis agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mcp[cli]>=2.0,<3",
  "pydantic>=2.8,<3",
  "streamlit>=1.54,<2",
  "arxiv>=2.4,<3",
  "bibtexparser>=1.4,<2",
  "requests>=2.32,<3",
  "httpx>=0.27,<1",
  "python-dotenv[cli]>=1,<2",
  "defusedxml>=0.7,<1",
  "playwright>=1.50,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.8", "mypy>=1.13"]
ranking = ["sentence-transformers>=5,<6"]
processing = ["pypdf>=4,<8", "fonttools>=4,<5"]

[project.scripts]
paper-agent-mcp = "paper_agent.mcp_server:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/paper_agent"]
